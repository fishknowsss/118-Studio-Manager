name = "your-sync-worker"
main = "src/index.js"
compatibility_date = "2026-07-14"
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "SYNC_DATA"
id = "replace-with-kv-namespace-id"

[[routes]]
pattern = "sync.example.com"
zone_name = "example.com"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://studio.example.com"
